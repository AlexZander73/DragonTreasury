name: Validate Treasury Source

# The public deployment now lives in MainWebsite, at /projects/DragonTreasury/.
# This repository is retained as the original source checkout, not a second host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
